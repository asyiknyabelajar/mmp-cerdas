<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contoh Portal: Satu Halaman untuk 96 Sesi MMP</title><style>body{font-family:system-ui,Arial;background:#f4f7f1;color:#103f32;margin:0}.head{background:#103f32;color:#fff;padding:22px}.layout{padding:18px;max-width:1300px;margin:auto}.toolbar{padding:15px;border:1px solid #dce6dc;background:#fff;border-radius:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar label{font-weight:bold}.toolbar select{flex:1;min-width:230px;padding:10px}iframe{width:100%;min-height:900px;height:calc(100vh - 125px);border:1px solid #dbe5d7;border-radius:12px;background:#fff;margin-top:15px}small{opacity:.8}</style></head><body><header class="head"><h1 style="margin:0">Contoh Integrasi Portal MMP</h1><small>Satu bingkai HTML menampilkan semua submateri melalui parameter lesson.</small></header><main class="layout"><div class="toolbar"><label for="lesson">Pilih sesi</label><select id="lesson"></select><button id="change">Tampilkan sesi</button></div><iframe id="frame" title="MMP Cerdas dalam halaman induk" src="index.html?embed=1&lesson=MMP-1.1.1-A" allow="microphone; autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe></main><script src="js/course-data.js"></script><script>const select=document.getElementById('lesson'),frame=document.getElementById('frame');window.MMP_COURSE.chapters.forEach(c=>c.sections.forEach(s=>s.materials.forEach(m=>m.lessons.forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.id+' — '+l.title;select.append(o)}))));document.getElementById('change').addEventListener('click',()=>{frame.src='index.html?embed=1&lesson='+encodeURIComponent(select.value)});</script></body></html>
